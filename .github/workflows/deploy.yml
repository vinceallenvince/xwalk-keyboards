# Deploy to Cloud Run on merge to main.
#
# Prerequisites (one-time GCP setup):
#
#   PROJECT_ID=xwalk-keyboards-01
#   SERVICE_ACCOUNT=github-deploy@${PROJECT_ID}.iam.gserviceaccount.com
#
#   # 1. Create a service account for GitHub Actions
#   gcloud iam service-accounts create github-deploy \
#     --project $PROJECT_ID \
#     --display-name "GitHub Actions deploy"
#
#   # 2. Grant it Cloud Run Developer + Service Account User + Cloud Build Editor
#   for ROLE in roles/run.developer roles/iam.serviceAccountUser roles/cloudbuild.builds.editor roles/storage.admin roles/artifactregistry.writer; do
#     gcloud projects add-iam-policy-binding $PROJECT_ID \
#       --member "serviceAccount:${SERVICE_ACCOUNT}" \
#       --role "$ROLE"
#   done
#
#   # 3. Create a Workload Identity Pool
#   gcloud iam workload-identity-pools create github-pool \
#     --project $PROJECT_ID \
#     --location global \
#     --display-name "GitHub Actions"
#
#   # 4. Create a Workload Identity Provider for GitHub
#   gcloud iam workload-identity-pools providers create-oidc github-provider \
#     --project $PROJECT_ID \
#     --location global \
#     --workload-identity-pool github-pool \
#     --display-name "GitHub" \
#     --attribute-mapping "google.subject=assertion.sub,attribute.repository=assertion.repository" \
#     --attribute-condition "assertion.repository_owner == 'vinceallenvince'" \
#     --issuer-uri "https://token.actions.githubusercontent.com"
#
#   # 5. Allow the GitHub repo to impersonate the service account
#   gcloud iam service-accounts add-iam-policy-binding $SERVICE_ACCOUNT \
#     --project $PROJECT_ID \
#     --role roles/iam.workloadIdentityUser \
#     --member "principalSet://iam.googleapis.com/projects/$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')/locations/global/workloadIdentityPools/github-pool/attribute.repository/vinceallenvince/xwalk-keyboards"
#
# Then add these GitHub repo secrets (Settings → Secrets and variables → Actions):
#
#   WIF_PROVIDER:       projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/github-pool/providers/github-provider
#   WIF_SERVICE_ACCOUNT: github-deploy@xwalk-keyboards-01.iam.gserviceaccount.com

name: Deploy to Cloud Run

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: xwalk-keyboards
          region: us-central1
          source: .

      - name: Smoke test
        run: |
          URL="https://xwalk-keyboards-21826886868.us-central1.run.app"
          for ROUTE in "" "/realtime" "/orchestration" "/about" "/camera-registry"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}${ROUTE}")
            echo "${ROUTE:-/}: $STATUS"
            if [ "$STATUS" -ge 400 ]; then
              echo "::error::${ROUTE:-/} returned $STATUS"
              exit 1
            fi
          done
