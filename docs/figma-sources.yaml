# Maps the user stories in users-scenarios.md to their Figma Design frames,
# following the taxonomy Epic -> Story -> Scenario -> UI. Figma authoring
# convention (keeps this file regenerable with no manual node entry):
#
#   Page:  "<Epic>"
#     └─ Section: "<exact story title>"   → story  (the mapping key)
#          ├─ "scenario"                  → scenario
#          ├─ "ui: …"                     → ui[0]  } reading order
#          └─ "ui: …"                     → ui[1]  } (top→bottom, left→right)
#
# Each `ui` entry is { node, shot }: the Figma node id (hyphen form) and the stem
# of the Playwright screenshot — runtime/e2e/__screens__/<epic_dir>/<shot>.png —
# that captures the same state. `shot: null` means no runtime screenshot exists
# yet. Node ids change when frames are rebuilt — re-run the sync to regenerate.
#
# The current Homepage Figma story combines the initial hero and selector
# interactions in one section. Its UI frames retain the initial state, neutral
# selector state, and the two hover-preview states in reading order.

file_key: VgqJ1zX1eByz9c8Ui8otpY
project_name: XWALK KEYBOARDS

epics:

  - epic: "Homepage"
    page: "0-1"
    epic_dir: "homepage"
    stories:
      - story: "As a visitor, I arrive at an immersive XWalk Keyboards homepage"
        scenario: "57-19"
        ui:
          - { node: "3-6", shot: "homepage-initial" }                     # homepage initial hero
          - { node: "69-354", shot: "homepage-scrolled-inactive" }        # scrolled selector: both options inactive
          - { node: "10-5", shot: "homepage-scrolled-realtime" }          # scrolled selector: Realtime hover preview
          # Orchestration is deliberately disabled on the homepage (no link,
          # no rollover) — this frame's hover-preview state has no live
          # equivalent to capture; shot stays null until that changes.
          - { node: "69-327", shot: null }                                # scrolled selector: Orchestration hover preview

