# Maps the user stories in users-scenarios.md to their Figma Design frames,
# following the taxonomy Epic -> Story -> Scenario -> UI. Figma authoring
# convention (keeps this file regenerable with no manual node entry):
#
#   Page:  "<Epic>"
#     └─ Section: "<exact story title>"   → story  (the mapping key)
#          ├─ "scenario"                  → scenario
#          ├─ "ui: …"                     → ui[0]  } reading order
#          └─ "ui: …"                     → ui[1]  } (top→bottom, left→right)
#
# Each `ui` entry is { node, shot }: the Figma node id (hyphen form) and the stem
# of the Playwright screenshot — runtime/e2e/__screens__/<epic_dir>/<shot>.png —
# that captures the same state. `shot: null` means no runtime screenshot exists
# yet. Node ids change when frames are rebuilt — re-run the sync to regenerate.
#
# The homepage hero story keeps its initial-state frames. The camera-link
# selector frames it used to carry (inactive, hover, excluded-camera states)
# were dropped when the Realtime study was retired; the scrolled state is now
# the introduction-video band (frames 506-449 desktop, 508-75 mobile). Those
# frames draw a mock YouTube player ("ILLUSTRATIVE VIDEO PREVIEW", custom
# controls); the runtime embeds YouTube's own player, so player chrome is
# expected drift, not a layout mismatch.
#
# Mobile: a story whose mobile (@mobile) behaviour diverges from desktop carries a
# parallel `ui_mobile:` list of the same { node, shot } shape, captured at the
# mobile viewport. Mobile screenshots live under a `mobile/` subdir —
# runtime/e2e/__screens__/<epic_dir>/mobile/<shot>.png — so a mobile entry may
# reuse a desktop shot stem. Desktop-only stories simply omit `ui_mobile`. Mobile
# Figma frames are authored after the desktop ones, so `node: null` marks a mobile
# entry whose frame does not exist yet (its `shot` stem is still reserved).
#
# Camera copy (VIN-79, VIN-87): the scenarios use 511NY's West Street at W. 23 St
# camera (CAM 5059) for the homepage and About backgrounds, and a camera-agnostic `<CAMERA STATUS LABEL>` placeholder
# everywhere else. VIN-79 briefly moved the default to Bellevue CAM 80007; VIN-87
# moved it back. The footer no longer credits a camera provider (frames 3-30
# and 372-51: "ABOUT // POWERED BY: Roboflow + Google Cloud Run"). Frames may
# still carry older or Bellevue copy ("WEST STREET @ W34 ST", "NYC DOT",
# "CAM SOURCE: 511NY", "BELLEVUE WAY @ NE 8TH ST"). Treat that as known copy
# drift, not a layout mismatch, until the frames are refreshed.

