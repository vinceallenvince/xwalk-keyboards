        scenario: "293-37"
        ui:
          - { node: "295-41", shot: null }  # five-minute pause modal
          - { node: "295-88", shot: null }  # inference closed / reload to continue

      - story: "As a visitor, I can view the live Realtime study full screen"
        scenario: "57-302"
        ui:
          - { node: "57-127", shot: null } # edge-to-edge live feed

