  - epic: "Realtime Study"
    page: "57-23"
    epic_dir: "realtime-study"
    stories:
      # The Figma section is titled "As a first-time visitor, I am told how to
      # hear the crosswalk and recieve an update on the crosswalk's current
      # environmental conditions" — it retains the older "first-time visitor"
      # phrasing (the sequence now runs on every visit) and a "recieve"
      # spelling. Rename the section on the next Figma pass to restore the
      # exact-title convention.
      # Conditions-variant shots: only the unknown variant is deterministic in
      # Layer 1 (no live calibration agent in the e2e environment). good/fair/
      # bad need a live or mocked calibration status; keyboard-ready needs a
      # real Roboflow WebRTC GPU session.
      - story: "As a visitor, I am told how to hear the crosswalk and receive an update on the crosswalk's current environmental conditions"
        scenario: "352-3"
        ui:
          - { node: "352-5", shot: "realtime-onboarding-how-to-hear" }        # step 1: how to hear, NEXT control
          - { node: "353-49", shot: null }                                    # step 2: conditions GOOD (mint, no caveat)
          - { node: "353-86", shot: null }                                    # step 2: conditions FAIR (amber, caveat)
          - { node: "353-123", shot: null }                                   # step 2: conditions BAD (red, caveat)
          - { node: "357-41", shot: "realtime-onboarding-conditions-unknown" } # step 2: conditions unavailable (no readout line)
          - { node: "354-160", shot: "realtime-onboarding-warming-up" }       # step 3: warming up, no dismissal control
          - { node: "367-41", shot: null }                                    # step 3 variant: GPU active, awaiting first predictions — needs a real session
          - { node: "355-197", shot: null }                                   # overlay removed on first predictions
        ui_mobile:
          - { node: "386-84", shot: null }                                    # step 1: how to hear
          - { node: "399-2", shot: null }                                     # step 2: conditions GOOD
          - { node: "399-36", shot: null }                                    # step 2: conditions FAIR
          - { node: "399-70", shot: null }                                    # step 2: conditions BAD
          - { node: "399-104", shot: null }                                   # step 2: conditions unavailable
          - { node: "399-138", shot: null }                                   # step 3: warming up
          - { node: "399-172", shot: null }                                   # step 3 variant: GPU active, awaiting first predictions
          - { node: "399-206", shot: null }                                   # overlay removed on first predictions

      # The info icon appears only after first predictions, which need a real
      # GPU session — no deterministic Layer 1 shot.
      - story: "As a visitor, I can reopen the how-to-hear instructions from the header"
        scenario: null
        ui:
          - { node: "361-2", shot: null } # step 1 reopened alone with CLOSE control
        ui_mobile:
