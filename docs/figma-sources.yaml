          - { node: "10-5", shot: "homepage-scrolled-realtime" }          # scrolled selector: CAM 5059 hover
          - { node: "69-327", shot: null }                                # scrolled selector: CAM 5072 hover
          - { node: "441-224", shot: null }                               # scrolled selector: one camera excluded (2 links)
        ui_mobile:
